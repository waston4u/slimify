name: Deploy Slimify to WordPress.org

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Check versions match
        shell: bash
        run: |
          HEADER=$(grep -iE '^[[:space:]]*\*?[[:space:]]*Version[[:space:]]*:' slimify.php | head -1 | sed -E 's/.*Version[[:space:]]*:[[:space:]]*//' | tr -d '\r' | xargs)
          CONSTANT=$(grep -oE "define\('SLIMIFY_VERSION',[[:space:]]*'[^']+'" slimify.php | sed -E "s/.*'([^']+)'$/\1/")
          STABLE=$(grep -iE '^Stable tag:' readme.txt | head -1 | sed -E 's/^[Ss]table [Tt]ag:[[:space:]]*//' | tr -d '\r' | xargs)

          echo "Header: $HEADER  Constant: $CONSTANT  Stable tag: $STABLE"
          if [ "$HEADER" != "$CONSTANT" ] || [ "$HEADER" != "$STABLE" ]; then
            echo "ERROR: Version, SLIMIFY_VERSION and Stable tag must match."
            exit 1
          fi

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -iE '^[[:space:]]*\*?[[:space:]]*Version[[:space:]]*:' slimify.php | head -1 | sed -E 's/.*Version[[:space:]]*:[[:space:]]*//')
          VERSION=$(echo "$VERSION" | tr -d '\r' | xargs)

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not determine plugin version from slimify.php"
            exit 1
          fi

          echo "Plugin version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"

          echo "Git release tag: ${TAG}"

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}"; then
            echo "Git tag ${TAG} already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git tag -a "${TAG}" -m "Release ${VERSION}"
            git push origin "${TAG}"
          fi

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: slimify
          VERSION: ${{ steps.version.outputs.version }}